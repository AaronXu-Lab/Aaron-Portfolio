<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>糖果漫游 · 无限糖罐</title>
    <meta
      name="description"
      content="限时完成随机任务，制造技能糖并不断挑战更高分。离线可玩的无限流糖果三消 PWA。"
    >
    <meta name="theme-color" content="#fff4e7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#211a38" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/tools/candy-match/manifest.webmanifest">
    <link rel="icon" href="/tools/candy-match/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/tools/candy-match/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="糖果漫游">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/tools/candy-match/" aria-label="重新打开糖果漫游">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <b>糖果漫游</b>
            <small>ENDLESS JAR</small>
          </span>
        </a>

        <div class="top-score" aria-label="历史数据">
          <span>最佳 <b id="best-score">0</b></span>
          <i></i>
          <span>糖果券 <b id="total-tickets">0</b></span>
        </div>

        <div class="top-actions">
          <button
            class="round-button"
            id="sound-button"
            type="button"
            aria-label="关闭音效"
            aria-pressed="true"
          >
            <span aria-hidden="true">♪</span>
          </button>
          <button class="install-button" id="install-button" type="button">安装</button>
        </div>
      </header>

      <main class="game">
        <aside class="hud" aria-labelledby="task-title">
          <section class="task-card">
            <div class="task-meta">
              <span id="task-number">任务 01</span>
              <strong>奖励 <b id="task-reward">+2</b></strong>
            </div>

            <div class="task-main">
              <span class="task-icon" id="task-icon" aria-hidden="true">◆</span>
              <div>
                <p>当前任务</p>
                <h1 id="task-title">获得 1,800 分</h1>
              </div>
            </div>

            <div class="task-progress">
              <div class="progress-copy">
                <span id="task-progress-label">0 / 1,800</span>
                <span id="time-label">00:40</span>
              </div>
              <div class="progress-track">
                <i id="task-progress-bar"></i>
                <em id="time-bar"></em>
              </div>
            </div>
          </section>

          <section class="run-stats" aria-label="本局数据">
            <div>
              <span>得分</span>
              <strong id="run-score">0</strong>
            </div>
            <div>
              <span>完成</span>
              <strong><b id="tasks-done">0</b> 项</strong>
            </div>
            <div>
              <span>奖励</span>
              <strong><b id="run-tickets">0</b> 券</strong>
            </div>
          </section>

          <div class="hud-actions">
            <button class="hint-button" id="hint-button" type="button">提示一步</button>
            <button class="restart-button" id="restart-button" type="button">重新开局</button>
          </div>

          <section class="skill-guide" aria-label="技能糖生成规则">
            <h2>技能糖</h2>
            <ul>
              <li><i class="skill-sample row"></i><span>横向四消</span><b>行消除</b></li>
              <li><i class="skill-sample column"></i><span>竖向四消</span><b>列消除</b></li>
              <li><i class="skill-sample burst"></i><span>L 形四消</span><b>区域消除</b></li>
              <li><i class="skill-sample color"></i><span>直线五消</span><b>同类消除</b></li>
            </ul>
          </section>
        </aside>

        <section class="board-stage" aria-label="糖果棋盘">
          <div class="board-frame">
            <div class="board-caption">
              <span>交换相邻糖果</span>
              <strong id="board-status">无限糖罐已开启</strong>
            </div>
            <div class="board" id="board" role="grid" aria-label="8 乘 8 糖果棋盘"></div>
            <div class="effect-layer" id="effect-layer" aria-hidden="true"></div>
            <div class="combo-burst" id="combo-burst" aria-hidden="true"></div>
            <div class="reward-burst" id="reward-burst" aria-hidden="true"></div>
          </div>
          <p class="live-status" id="live-status" role="status" aria-live="polite">
            请选择一颗糖果开始。
          </p>
        </section>
      </main>
    </div>

    <dialog class="sheet game-over-dialog" id="game-over-dialog" aria-labelledby="game-over-title">
      <span class="dialog-kicker">TIME'S UP</span>
      <h2 id="game-over-title">糖果罐合上了</h2>
      <p>本轮任务时间已经用完，奖励已存进你的糖果券包。</p>
      <dl class="result-grid">
        <div><dt>本局得分</dt><dd id="final-score">0</dd></div>
        <div><dt>完成任务</dt><dd id="final-tasks">0</dd></div>
        <div><dt>本局奖励</dt><dd id="final-tickets">0</dd></div>
      </dl>
      <p class="record-note" id="record-note"></p>
      <button class="primary-button" id="play-again-button" type="button">再来一罐</button>
    </dialog>

    <dialog class="sheet install-dialog" id="install-dialog" aria-labelledby="install-title">
      <div class="dialog-head">
        <div>
          <span class="dialog-kicker">PLAY OFFLINE</span>
          <h2 id="install-title">安装糖果漫游</h2>
        </div>
        <button class="close-button" data-close="install-dialog" type="button" aria-label="关闭">×</button>
      </div>
      <p id="install-copy">安装后可以从主屏幕直接打开，断网也能继续游戏。</p>
      <ol class="install-steps" id="install-steps"></ol>
      <button class="primary-button" id="confirm-install-button" type="button">安装应用</button>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
