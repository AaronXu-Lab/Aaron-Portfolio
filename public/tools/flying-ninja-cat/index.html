<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="《飞天忍者猫》SWF 游戏的纯 HTML5 Canvas 重制版"
    />
    <title>飞天忍者猫 · HTML5 重制版</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css?v=20261101-2" />
  </head>
  <body>
    <main class="game-shell">
      <canvas
        id="game"
        width="960"
        height="540"
        tabindex="0"
        role="application"
        aria-label="飞天忍者猫。点击或按空格跳跃，再次点击发射绳索。"
      ></canvas>
      <div id="game-controls" class="game-controls" role="group" aria-label="游戏控制" hidden>
        <button id="pause-button" type="button" aria-pressed="false" title="暂停或继续（P）">暂停</button>
        <button id="mute-button" type="button" aria-pressed="false" title="切换声音（M）">声音：开</button>
      </div>
      <section id="pause-overlay" class="pause-overlay" aria-label="游戏已暂停" hidden>
        <h1>已暂停</h1>
        <p>准备好了，再继续冒险。</p>
        <button id="resume-button" type="button">继续游戏</button>
        <small>空格 / P 继续 · M 切换声音</small>
      </section>
      <p id="status" class="sr-only" aria-live="polite">正在载入游戏素材</p>
    </main>
    <section class="orientation-gate" role="status" aria-live="polite">
      <div class="orientation-icon" aria-hidden="true"><span></span></div>
      <h1>请横屏运行</h1>
      <p>旋转设备后，即可继续游玩《飞天忍者猫》。</p>
    </section>
    <script src="./item-data.js?v=20260803-1"></script>
    <script type="module" src="./game.js?v=20261101-2"></script>
  </body>
</html>
