<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#b4d8ce"><title>海风慢递</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><div id="scene" aria-label="鹈鹕骑自行车的三维海岸场景"></div><div class="grain"></div>
<header><div class="brand"><span class="mark">✳</span><div><strong>海风慢递</strong><small>THE COASTAL RIDE</small></div></div><button id="help" class="icon-btn" aria-label="操作说明">?</button></header>
<div class="location"><span class="dot"></span> COAST ROAD <span class="slash">/</span> <span id="weather">晴朗</span></div>
<div class="caption"><div class="eyebrow">A LITTLE JOURNEY BY THE SEA</div><h1>慢一点，<br><em>刚刚好。</em></h1><p>海风会把今天送到远方。</p></div>
<div class="hint" id="hint">拖动转动视角 <span>↔</span></div>
<div class="dashboard"><div class="dashboard-top"><div><span class="label">今日行程</span><div class="distance"><span id="distance">0.00</span><small> km</small></div></div><div class="speed-display"><span class="label">骑行速度</span><div><span id="speed">12</span><small> km/h</small></div></div></div><div class="line"></div><div class="controls"><button id="slower" class="round" aria-label="减速">−</button><button id="toggle" class="play" aria-label="暂停骑行"><span id="play-icon">Ⅱ</span><span id="play-label">暂停</span></button><button id="faster" class="round" aria-label="加速">＋</button><div class="divider"></div><button id="bell" class="round bell" aria-label="按响车铃">♩</button><button id="sky" class="round" aria-label="切换日夜">☼</button></div><div class="keyboard">空格 暂停 / 继续　·　← → 调速　·　B 车铃　·　D 日夜</div></div>
<div id="toast" role="status"></div><div id="help-panel" class="help-panel" hidden><button id="close-help" aria-label="关闭">×</button><span class="eyebrow">HOW TO RIDE</span><h2>跟着海风走</h2><p>拖动画面，换个角度看海。用下方按钮调整速度、按铃或切换日夜。</p><p>键盘：空格暂停或继续，← / → 调速，B 按铃，D 切换日夜。</p><button id="got-it">出发吧 ↗</button></div></main><script type="module" src="app.js"></script></body></html>
