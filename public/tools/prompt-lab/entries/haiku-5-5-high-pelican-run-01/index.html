<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>鹈鹕骑自行车</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="scene" aria-label="鹈鹕骑自行车的 3D 木栈道场景"></canvas>

    <header class="hud-top">
      <div class="pill" aria-label="收集与距离">
        <svg class="fish-ico" viewBox="0 0 24 14" aria-hidden="true"><path d="M1 7c4-5 10-6 15-2l4-3v12l-4-3c-5 4-11 3-15-2z" fill="currentColor"/></svg>
        <span id="fish" class="fish-count">0</span>
        <span class="sep" aria-hidden="true"></span>
        <span id="dist">0 m</span>
        <span id="best" class="best"></span>
      </div>
      <div class="actions">
        <button id="btn-sound" class="ui-btn" type="button" aria-label="声音开关" title="声音 (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9c1.3 1.3 1.3 4.7 0 6M18.5 6.5c2.8 2.8 2.8 8.2 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-cam" class="ui-btn" type="button" aria-label="切换镜头" title="镜头 (C)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 11l5-3v8l-5-3z" fill="currentColor"/></svg>
        </button>
        <button id="btn-pause" class="ui-btn" type="button" aria-label="暂停" aria-pressed="false" title="暂停 (P)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="btn-help" class="ui-btn" type="button" aria-label="快捷键" title="快捷键 (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>

    <div id="pause" class="overlay" hidden>
      <div class="overlay-card">
        <p class="overlay-title">已暂停</p>
        <button id="btn-resume" class="text-btn" type="button">继续 · P</button>
      </div>
    </div>

    <section id="help" class="help" aria-label="快捷键" hidden>
      <div class="help-card">
        <h2>快捷键</h2>
        <dl>
          <dt><kbd>Space</kbd> <kbd>W</kbd> <kbd>↑</kbd></dt><dd>按住踩踏板</dd>
          <dt><kbd>←</kbd> <kbd>→</kbd> <kbd>A</kbd> <kbd>D</kbd></dt><dd>变道</dd>
          <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>跳跃，鹈鹕拍翅</dd>
          <dt><kbd>S</kbd> <kbd>↓</kbd></dt><dd>按住刹车</dd>
          <dt><kbd>C</kbd></dt><dd>切换镜头：追随、侧面、环绕</dd>
          <dt><kbd>P</kbd> <kbd>Esc</kbd></dt><dd>暂停或继续</dd>
          <dt><kbd>M</kbd></dt><dd>声音开关</dd>
          <dt><kbd>R</kbd></dt><dd>重新开始</dd>
          <dt><kbd>H</kbd></dt><dd>显示或隐藏快捷键</dd>
        </dl>
        <p class="help-touch">触屏：按住任意位置踩踏板；左右滑动变道；向上滑动跳跃。</p>
        <button id="btn-help-close" class="text-btn" type="button">关闭 · H</button>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
