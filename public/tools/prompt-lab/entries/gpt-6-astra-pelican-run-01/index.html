<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5c6ac">
  <title>落日邮差 · GPT-6 Astra</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" aria-label="落日邮差，鹈鹕骑行游戏">
    <canvas id="scene" tabindex="0" aria-label="可拖动旋转的实时 3D 海滨骑行场景。W 加速，空格跳跃，B 响铃，P 暂停。"></canvas>
    <header class="masthead">
      <div class="identity"><span class="edition">PELICAN POST</span><h1>落日邮差<span class="stamp">海岸线 01</span></h1></div>
      <button class="icon-button" id="help" aria-label="玩法与快捷键" title="玩法与快捷键（H）"><img src="./icons/question.svg" alt=""></button>
    </header>
    <section class="delivery" aria-label="收集进度">
      <span class="mail-icon"><img src="./icons/envelope.svg" alt=""></span>
      <div class="delivery-copy"><span id="route-label">给海风的八封信</span><div class="letter-dots" id="letter-dots" aria-hidden="true"></div></div>
      <span class="count"><b id="letters">0</b><span> / 8</span></span>
    </section>
    <div class="scene-tools" aria-label="场景设置">
      <button class="icon-button" id="daylight" aria-label="切换月夜" title="切换昼夜（N）" aria-pressed="false"><img src="./icons/moon.svg" alt=""></button>
      <button class="icon-button" id="view" aria-label="切换视角" title="切换视角（C）"><img src="./icons/camera.svg" alt=""></button>
      <button class="icon-button" id="sound" aria-label="开启声音" title="声音（M）" aria-pressed="false"><img src="./icons/speaker-slash.svg" alt=""></button>
      <button class="icon-button" id="pause" aria-label="暂停" title="暂停（P）" aria-pressed="false"><img src="./icons/pause.svg" alt=""></button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite">按住骑行，遇到高处的信就跳起来</div>
    <footer class="cockpit">
      <div class="telemetry"><div class="speed"><strong id="speed">0</strong><span>km/h</span></div><div class="trip"><span id="ride-state">海风巡航</span><span><b id="distance">0</b> m</span></div><button id="bell" class="bell" aria-label="响铃" title="响铃（B）"><img src="./icons/bell.svg" alt=""><span>叮铃</span><kbd>B</kbd></button></div>
      <div class="controls">
        <button id="jump" class="jump"><img src="./icons/arrow-up.svg" alt=""><span>跃起<small>轻点一下</small></span><kbd>Space</kbd></button>
        <button id="pedal" class="pedal" aria-label="按住加速骑行"><span class="pedal-symbol">↗</span><span>骑行<small>按住加速</small></span><kbd>W</kbd></button>
      </div>
      <div class="footnote"><span>拖动场景，转个角度看海</span><button id="reset" aria-label="重新开始" title="重新开始（R）"><img src="./icons/arrows-clockwise.svg" alt="">重来</button></div>
    </footer>
    <div id="loading" class="loading"><span>正在打开海岸线</span><div></div></div>
    <div id="error" class="error" hidden><h2>这片海还没加载好</h2><p>请使用支持 WebGL 2 的浏览器，再试一次。</p><button onclick="location.reload()">重新加载</button></div>
    <dialog id="instructions">
      <form method="dialog"><button class="close" aria-label="关闭玩法说明">×</button></form>
      <span class="edition">骑行手册</span><h2>把信寄给海风。</h2>
      <p>沿海岸骑行，收集八封漂浮的信。低处的信直接接住，高处的信需要跳跃。错过也没关系，前面还有。</p>
      <dl><div><dt>按住骑行 / 加速</dt><dd><kbd>W</kbd> / <kbd>↑</kbd></dd></div><div><dt>跃起收信</dt><dd><kbd>Space</kbd></dd></div><div><dt>响铃，打个招呼</dt><dd><kbd>B</kbd></dd></div><div><dt>月夜 / 视角 / 声音</dt><dd><kbd>N</kbd> <kbd>C</kbd> <kbd>M</kbd></dd></div><div><dt>暂停 / 重来 / 帮助</dt><dd><kbd>P</kbd> <kbd>R</kbd> <kbd>H</kbd></dd></div><div><dt>旋转视角</dt><dd>单指拖动 / <kbd>←</kbd> <kbd>→</kbd></dd></div></dl>
      <p class="quiet">没有倒计时，也不会摔倒。慢慢骑就好。</p><form method="dialog"><button class="start">出发</button></form>
    </dialog>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
